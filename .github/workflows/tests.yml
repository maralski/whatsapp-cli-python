name: Synthetic tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  history-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - run: go mod verify
        working-directory: history_bridge
      - run: go test -race ./...
        working-directory: history_bridge
      - run: go vet ./...
        working-directory: history_bridge
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -W error::ResourceWarning -m unittest -v
      - run: python -m venv .venv
      - run: '.venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements.lock'
      - run: .venv/bin/python -W error::ResourceWarning -m unittest -v test_terminal_job_control
      - run: .venv/bin/python -I -B verify_protocol.py
